    <meta charset="UTF-8">

    <title>The Pay-Per-Appointment (PPA) Model | Results-Based Growth | IMPACTA</title>

    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Noto Sans', sans-serif; scroll-behavior: smooth; }
        .bg-impacta { background-color: #0c62ab; }
        .text-impacta { color: #0c62ab; }
        .border-impacta { border-color: #0c62ab; }
        .hover-bg-impacta:hover { background-color: #084a85; }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>

<body class="bg-slate-50 text-gray-900 flex flex-col min-h-screen">
    <div id="root" class="flex-grow flex flex-col"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // --- ICONS ---
        const IconCheckCircle = ({ className }) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>;
        const IconMenu = ({ className }) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><line x1="4" x2="20" y1="12" y2="12"/><line x1="4" x2="20" y1="6" y2="6"/><line x1="4" x2="20" y1="18" y2="18"/></svg>;
        const IconX = ({ className }) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>;
        const IconChevronDown = ({ className }) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="m6 9 6 6 6-6"/></svg>;
        const IconShieldCheck = ({ className }) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="m9 12 2 2 4-4"/></svg>;

        // --- DATA ---
        const industryLinks = [
            { name: "Auto - Repair", link: "automotive.html" }, { name: "Auto - Sales", link: "auto-sales.html" },
            { name: "Fitness", link: "fitness.html" }, { name: "Home Services", link: "home-services.html" },
            { name: "HVAC", link: "hvac.html" }, { name: "Insurance", link: "insurance.html" },
            { name: "Landscaping", link: "landscaping.html" }, { name: "Medical", link: "medical.html" },
            { name: "Painting", link: "painting.html" }, { name: "Pest Control", link: "pest-control.html" },
            { name: "Plumbing", link: "plumbing.html" }, { name: "Professional Services", link: "professional-services.html" },
            { name: "Real Estate", link: "real-estate.html" }, { name: "Restaurants", link: "restaurants.html" },
            { name: "Roofing", link: "roofing.html" }, { name: "Salons", link: "salons.html" },
            { name: "Solar", link: "solar.html" }, { name: "Wellness & Spa", link: "wellness.html" }
        ];

        // --- COMPONENTS ---
        const Button = ({ children, variant = 'primary', className = '', onClick }) => {
            const baseStyle = "px-6 py-3 rounded-md font-semibold transition-all duration-200 flex items-center justify-center gap-2 cursor-pointer";
            const variants = {
                primary: "bg-impacta text-white hover:bg-blue-800 shadow-lg hover:shadow-xl",
                secondary: "bg-white text-impacta border-2 border-impacta hover:bg-blue-50",
                outline: "border-2 border-slate-300 text-slate-700 hover:bg-slate-50 hover:text-impacta"
            };
            return <button onClick={onClick} className={`${baseStyle} ${variants[variant]} ${className}`}>{children}</button>;
        };

        const Navbar = () => {
            const [isOpen, setIsOpen] = useState(false);
            const [isMobileIndustriesOpen, setIsMobileIndustriesOpen] = useState(false);
            const [scrolled, setScrolled] = useState(false);

            useEffect(() => {
                const handleScroll = () => setScrolled(window.scrollY > 20);
                window.addEventListener('scroll', handleScroll);
                return () => window.removeEventListener('scroll', handleScroll);
            }, []);

            const midPoint = Math.ceil(industryLinks.length / 2);
            const leftCol = industryLinks.slice(0, midPoint);
            const rightCol = industryLinks.slice(midPoint);

            return (
                <nav className={`fixed w-full z-50 transition-all duration-300 ${scrolled ? 'bg-white shadow-md py-3' : 'bg-white/90 backdrop-blur-sm shadow-sm py-4'} top-0 left-0`}>
                    <div className="max-w-7xl mx-auto px-6 flex justify-between items-center">
                        <a href="index.html" className="flex items-center">
                            <img src="img/logo-main-2025.png" alt="IMPACTA Business Solutions" className="h-12 w-auto object-contain rounded-md" />
                        </a>
                        
                        <div className="hidden md:flex items-center gap-8">
                            <a href="services.html" className="text-sm font-medium text-slate-700 hover:text-[#0c62ab] transition-colors">Services</a>
                            <a href="about-us.html" className="text-sm font-medium text-slate-700 hover:text-[#0c62ab] transition-colors">About Us</a>
                            
                            <div className="relative group">
                                <button className="flex items-center gap-1 text-sm font-medium text-slate-700 hover:text-[#0c62ab] transition-colors">
                                    Industries <IconChevronDown className="w-4 h-4" />
                                </button>
                                <div className="absolute hidden group-hover:block top-full left-1/2 -translate-x-1/2 pt-4 w-[600px]">
                                    <div className="bg-white rounded-xl shadow-2xl p-6 border border-gray-100 flex flex-row gap-8">
                                        <div className="flex-1 space-y-2">
                                            {leftCol.map((ind, i) => <a key={i} href={ind.link} className="block px-3 py-2 text-sm font-medium text-gray-600 hover:bg-blue-50 hover:text-impacta rounded-lg transition-colors">{ind.name}</a>)}
                                        </div>
                                        <div className="flex-1 space-y-2">
                                            {rightCol.map((ind, i) => <a key={i} href={ind.link} className="block px-3 py-2 text-sm font-medium text-gray-600 hover:bg-blue-50 hover:text-impacta rounded-lg transition-colors">{ind.name}</a>)}
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <a href="pricing.html" className="text-sm font-medium text-slate-700 hover:text-[#0c62ab] transition-colors">Pricing</a>
                            <a href="faqs.html" className="text-sm font-medium text-slate-700 hover:text-[#0c62ab] transition-colors">FAQs</a>
                            <a href="contact-us.html" className="text-sm font-medium text-slate-700 hover:text-[#0c62ab] transition-colors">Contact</a>
                            <a href="login.html" className="text-sm font-medium text-slate-700 hover:text-[#0c62ab] transition-colors">Login</a>

                            <Button variant="primary" className="py-2 px-5 text-sm" onClick={() => window.location.href = '48-hour-fix.html'}>
                                Book My 48-hour Fix
                            </Button>
                        </div>

                        <button className="md:hidden text-slate-800" onClick={() => setIsOpen(!isOpen)}>
                            {isOpen ? <IconX className="w-6 h-6" /> : <IconMenu className="w-6 h-6 text-slate-800" />}
                        </button>
                    </div>

                    {isOpen && (
                        <div className="absolute top-full left-0 w-full bg-white shadow-xl py-6 px-6 flex flex-col gap-4 md:hidden border-t max-h-[85vh] overflow-y-auto">
                            <a href="services.html" className="text-gray-700 font-medium text-lg" onClick={() => setIsOpen(false)}>Services</a>
                            <a href="about-us.html" className="text-gray-700 font-medium text-lg" onClick={() => setIsOpen(false)}>About Us</a>
                            <div>
                                <button onClick={() => setIsMobileIndustriesOpen(!isMobileIndustriesOpen)} className="flex items-center justify-between w-full text-gray-700 font-medium text-lg">
                                    Industries <IconChevronDown className={`w-5 h-5 transition-transform ${isMobileIndustriesOpen ? 'rotate-180' : ''}`} />
                                </button>
                                {isMobileIndustriesOpen && (
                                    <div className="pl-4 mt-3 border-l-2 border-gray-100 space-y-3 pb-2">
                                        {industryLinks.map((ind, i) => <a key={i} href={ind.link} className="block text-gray-600 text-base" onClick={() => setIsOpen(false)}>{ind.name}</a>)}
                                    </div>
                                )}
                            </div>
                            <a href="pricing.html" className="text-gray-700 font-medium text-lg" onClick={() => setIsOpen(false)}>Pricing</a>
                            <a href="faqs.html" className="text-gray-700 font-medium text-lg" onClick={() => setIsOpen(false)}>FAQs</a>
                            <a href="contact-us.html" className="text-gray-700 font-medium text-lg" onClick={() => setIsOpen(false)}>Contact</a>
                            <a href="login.html" className="text-gray-700 font-medium text-lg" onClick={() => setIsOpen(false)}>Login</a>
                            <Button variant="primary" className="w-full mt-4" onClick={() => window.location.href = '48-hour-fix.html'}>Get My 48-Hour Fix</Button>
                        </div>
                    )}
                </nav>
            );
        };

        const Footer = () => (
            <footer className="bg-slate-900 text-slate-400 py-12 border-t border-slate-800 mt-auto w-full">
                <div className="max-w-7xl mx-auto px-6 flex flex-col md:flex-row justify-between items-center gap-6 text-center md:text-left">
                    <div className="text-sm opacity-90">
                        <strong>IMPACTA Business Solutions Inc.</strong><br />
                        <span className="opacity-75">Owned & Operated in Ocala, FL</span><br />
                        <a href="tel:+13524419448" className="hover:text-white transition-colors mt-2 inline-block font-semibold">(352) 441-9448</a>
                    </div>
                    <div className="flex gap-6 text-sm font-medium justify-center md:justify-end">
                        <a href="privacy.html" className="hover:text-white transition-colors">Privacy Policy</a>
                        <a href="terms.html" className="hover:text-white transition-colors">Terms of Service</a>
                    </div>
                </div>
            </footer>
        );

        const PPAHeader = () => (
            <section className="pt-32 pb-16 bg-white border-b border-slate-200">
                <div className="max-w-4xl mx-auto px-6 text-center">
                    <div className="inline-flex items-center gap-2 bg-blue-50 text-[#0c62ab] font-bold rounded-full px-4 py-1.5 text-sm mb-6 border border-blue-100">
                        Stop Renting Growth
                    </div>
                    <h1 className="text-4xl md:text-5xl font-extrabold text-slate-900 mb-6 tracking-tight">
                        The Pay-Per-Appointment (PPA) Model
                    </h1>
                    <p className="text-xl text-slate-600 leading-relaxed font-medium">
                        Most agencies sell "intent" or "clicks." We sell <strong className="text-slate-900">results</strong>. Our model aligns our operational execution with your P&L, coaching your team for long-term independence.
                    </p>
                </div>
            </section>
        );

        const PPARoadmap = () => (
            <section className="py-20 bg-slate-50">
                <div className="max-w-7xl mx-auto px-6">
                    <div className="grid lg:grid-cols-3 gap-8 items-stretch">
                        
                        {/* Phase 1 */}
                        <div className="bg-white rounded-2xl p-8 border border-slate-200 shadow-sm flex flex-col h-full hover:shadow-md transition-shadow">
                            <div className="mb-6">
                                <span className="text-sm font-bold text-slate-400 uppercase tracking-wider mb-2 block">Phase 1</span>
                                <h3 className="text-2xl font-bold text-slate-900">Revenue Architecture & Setup <span className="text-[#0c62ab]">(I DO)</span></h3>
                            </div>
                            <div className="mb-6 pb-6 border-b border-slate-100">
                                <div className="text-3xl font-extrabold text-slate-900">$350</div>
                                <div className="text-sm font-medium text-slate-500">One-Time Fee</div>
                            </div>
                            <p className="text-slate-600 mb-8 flex-grow">
                                We don't just "look" at your business; we build the technical infrastructure required to handle aggressive scale without breaking. This mandatory audit stops the "Sales Leaks" currently costing you revenue.
                            </p>
                            <ul className="space-y-4 mb-8">
                                <li className="flex items-start gap-3 text-sm text-slate-700 font-medium"><IconCheckCircle className="w-5 h-5 text-green-500 shrink-0"/> Full Pipeline Snapshot</li>
                                <li className="flex items-start gap-3 text-sm text-slate-700 font-medium"><IconCheckCircle className="w-5 h-5 text-green-500 shrink-0"/> Custom SQA Scripting</li>
                                <li className="flex items-start gap-3 text-sm text-slate-700 font-medium"><IconCheckCircle className="w-5 h-5 text-green-500 shrink-0"/> Automation Blueprint (60s Response)</li>
                                <li className="flex items-start gap-3 text-sm text-slate-700 font-medium"><IconCheckCircle className="w-5 h-5 text-green-500 shrink-0"/> End-to-End Tech Stack Integration</li>
                                <li className="flex items-start gap-3 text-sm text-slate-700 font-medium"><IconCheckCircle className="w-5 h-5 text-green-500 shrink-0"/> 90-Day Independence Roadmap</li>
                            </ul>
                            <Button variant="outline" className="w-full mt-auto" onClick={() => window.location.href = 'revenue-diagnostic.html'}>Initiate Revenue Audit</Button>
                        </div>

                        {/* Phase 2 */}
                        <div className="bg-white rounded-2xl p-8 border-2 border-[#0c62ab] shadow-2xl flex flex-col h-full relative transform lg:-translate-y-4 z-10">
                            <div className="absolute top-0 left-1/2 -translate-x-1/2 -translate-y-1/2 bg-[#0c62ab] text-white px-4 py-1 rounded-full text-xs font-bold uppercase tracking-widest shadow-md">
                                The Active Engine
                            </div>
                            <div className="mb-6">
                                <span className="text-sm font-bold text-[#0c62ab] uppercase tracking-wider mb-2 block">Phase 2</span>
                                <h3 className="text-2xl font-bold text-slate-900">Performance Execution <span className="text-[#0c62ab]">(WE DO)</span></h3>
                            </div>
                            <div className="mb-6 pb-6 border-b border-slate-100">
                                <div className="text-2xl font-extrabold text-[#0c62ab]">Performance-Based</div>
                                <div className="text-sm font-bold text-slate-500 uppercase tracking-wide mt-1">SQA Rate Only</div>
                            </div>
                            <p className="text-slate-600 mb-8 flex-grow">
                                We activate the PPA engine. You only pay for <strong>Sales Qualified Appointments (SQAs) or Acquisitions</strong>. We manage the lead flow while coaching your team for system mastery.
                            </p>
                            <ul className="space-y-4 mb-8 bg-blue-50/50 p-4 rounded-xl">
                                <li className="flex items-start gap-3 text-sm text-slate-800 font-bold"><IconCheckCircle className="w-5 h-5 text-[#0c62ab] shrink-0"/> 100% Performance Aligned</li>
                                <li className="flex items-start gap-3 text-sm text-slate-700 font-medium"><IconCheckCircle className="w-5 h-5 text-[#0c62ab] shrink-0"/> Weekly RevOps Coaching for Staff</li>
                                <li className="flex items-start gap-3 text-sm text-slate-700 font-medium"><IconCheckCircle className="w-5 h-5 text-[#0c62ab] shrink-0"/> High-Intent SQA Volume</li>
                                <li className="flex items-start gap-3 text-sm text-slate-700 font-medium"><IconCheckCircle className="w-5 h-5 text-[#0c62ab] shrink-0"/> Live Pipeline Audit Transparency</li>
                                <li className="flex items-start gap-3 text-sm text-slate-700 font-medium"><IconCheckCircle className="w-5 h-5 text-[#0c62ab] shrink-0"/> 60-Second Automated Response</li>
                            </ul>
                            <Button variant="primary" className="w-full mt-auto text-lg shadow-blue-200" onClick={() => window.location.href = 'revenue-diagnostic.html'}>Activate Performance Engine</Button>
                        </div>

                        {/* Phase 3 */}
                        <div className="bg-white rounded-2xl p-8 border border-slate-200 shadow-sm flex flex-col h-full hover:shadow-md transition-shadow">
                            <div className="mb-6">
                                <span className="text-sm font-bold text-slate-400 uppercase tracking-wider mb-2 block">Phase 3</span>
                                <h3 className="text-2xl font-bold text-slate-900">Operational Mastery <span className="text-[#0c62ab]">(YOU DO)</span></h3>
                            </div>
                            <div className="mb-6 pb-6 border-b border-slate-100">
                                <div className="text-3xl font-extrabold text-slate-900">$2,500<span className="text-lg font-medium text-slate-500"> - $5k+</span></div>
                                <div className="text-sm font-medium text-slate-500">Per Month</div>
                            </div>
                            <p className="text-slate-600 mb-8 flex-grow">
                                This is the exit strategy. We transition the "keys" of the growth engine to your internal team. You move from renting growth to owning a self-sustaining revenue asset.
                            </p>
                            <ul className="space-y-4 mb-8">
                                <li className="flex items-start gap-3 text-sm text-slate-700 font-medium"><IconCheckCircle className="w-5 h-5 text-slate-400 shrink-0"/> Ops Lead Coaching & Mentorship</li>
                                <li className="flex items-start gap-3 text-sm text-slate-700 font-medium"><IconCheckCircle className="w-5 h-5 text-slate-400 shrink-0"/> Final Mastery Verification Audit</li>
                                <li className="flex items-start gap-3 text-sm text-slate-700 font-medium"><IconCheckCircle className="w-5 h-5 text-slate-400 shrink-0"/> Strategic Google/Meta Oversight</li>
                                <li className="flex items-start gap-3 text-sm text-slate-700 font-medium"><IconCheckCircle className="w-5 h-5 text-slate-400 shrink-0"/> Advanced LTV Optimization</li>
                                <li className="flex items-start gap-3 text-sm text-slate-700 font-medium"><IconCheckCircle className="w-5 h-5 text-slate-400 shrink-0"/> Predictable Scalable ROI</li>
                            </ul>
                            <Button variant="outline" className="w-full mt-auto" onClick={() => window.location.href = 'revenue-diagnostic.html'}>Transition to Mastery</Button>
                        </div>

                    </div>
                </div>
            </section>
        );

        const SQASection = () => (
            <section className="py-20 bg-white">
                <div className="max-w-5xl mx-auto px-6">
                    <div className="bg-slate-900 rounded-3xl p-10 md:p-16 flex flex-col md:flex-row items-center gap-12 shadow-2xl relative overflow-hidden">
                        <div className="absolute top-0 right-0 w-64 h-64 bg-blue-500 opacity-10 rounded-full blur-3xl -translate-y-1/2 translate-x-1/2"></div>
                        
                        <div className="w-20 h-20 bg-[#0c62ab] rounded-2xl flex items-center justify-center shrink-0 shadow-lg relative z-10">
                            <IconShieldCheck className="w-10 h-10 text-white" />
                        </div>
                        
                        <div className="relative z-10 flex-1 text-center md:text-left">
                            <h2 className="text-3xl font-bold text-white mb-4">What exactly is an SQA?</h2>
                            <p className="text-slate-300 text-lg leading-relaxed mb-6">
                                We don't get paid for vague "leads" or "clicks." We get paid for <strong>Sales Qualified Appointments or Acquisitions</strong>. An IMPACTA SQA is a lead that has been vetted through your specific custom criteria, has confirmed their budget/need, and has a firm time booked on your calendar.
                            </p>
                            <div className="inline-block bg-blue-900/50 border border-blue-700/50 text-blue-200 px-6 py-3 rounded-lg font-bold text-lg tracking-wide">
                                If they don't show up, or they don't qualify—you don't pay.
                            </div>
                        </div>
                    </div>
                </div>
            </section>
        );

        const CTASection = () => (
            <section className="py-20 bg-slate-50">
                <div className="max-w-4xl mx-auto px-6">
                    <div className="bg-white border border-slate-200 rounded-3xl p-12 text-center shadow-xl">
                        <h2 className="text-3xl md:text-4xl font-bold text-slate-900 mb-6">Ready to stop renting your growth?</h2>
                        <p className="text-slate-600 text-lg mb-10 max-w-2xl mx-auto">
                            The $350 Diagnostic reveals the leaks in your current intake process and sets the exact price for your custom PPA partnership. No retainers. Just a clear roadmap to profitability.
                        </p>
                        <Button variant="primary" className="mx-auto text-lg px-8 py-4 shadow-blue-200 hover:-translate-y-1" onClick={() => window.location.href = 'revenue-diagnostic.html'}>
                            Book Your Revenue Diagnostic
                        </Button>
                    </div>
                </div>
            </section>
        );

        const App = () => {
            return (
                <div className="flex flex-col min-h-screen">
                    <Navbar />
                    <main className="flex-grow">
                        <PPAHeader />
                        <PPARoadmap />
                        <SQASection />
                        <CTASection />
                    </main>
                    <Footer />
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
